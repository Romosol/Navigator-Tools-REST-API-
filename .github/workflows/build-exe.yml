name: Build Windows EXE

on:
  release:
    types: [published]
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check Python script
        run: |
          python -m py_compile navigator_app.py

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          if (Test-Path "app.ico") {
            pyinstaller --noconsole --onefile --icon "app.ico" --add-data "app.ico;." --name "NavigatorApp" navigator_app.py
          } else {
            pyinstaller --noconsole --onefile --name "NavigatorApp" navigator_app.py
          }

      - name: Upload Artifact to Run
        uses: actions/upload-artifact@v4
        with:
          name: NavigatorApp
          path: dist/NavigatorApp.exe

      - name: Attach Assets to Release (on release or tag)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NavigatorApp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Assets to Latest Release (on manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          try {
            $latestTag = (gh release view --json tagName -q .tagName)
            if ($latestTag) {
              Write-Host "Uploading assets to latest release: $latestTag"
              gh release upload $latestTag dist\NavigatorApp.exe --clobber
            }
          } catch {
            Write-Host "No existing release found or upload skipped."
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
