name: Build Windows EXE

on:
  release:
    types: [published]
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "NavigatorApp" navigator_app.py

      - name: Prepare release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\NavigatorApp.exe -Destination release\
          if (Test-Path list.xlsx) { Copy-Item list.xlsx -Destination release\ }
          if (Test-Path config.json) { Copy-Item config.json -Destination release\ }
          Compress-Archive -Path release\* -DestinationPath NavigatorApp-Windows.zip -Force

      - name: Upload Artifact to Run
        uses: actions/upload-artifact@v4
        with:
          name: NavigatorApp-Windows
          path: NavigatorApp-Windows.zip

      - name: Attach Assets to Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NavigatorApp-Windows.zip
            dist/NavigatorApp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
